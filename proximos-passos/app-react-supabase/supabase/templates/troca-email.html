<div style="background:#0B0B0B;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:480px;margin:0 auto;background:#141414;border:1px solid #2A2A2A;border-radius:16px;padding:32px;color:#E4E4E4">
    <div style="font-weight:900;font-size:22px;letter-spacing:.02em;color:#FBC009">ADDEGAS</div>
    <h1 style="margin:24px 0 12px;font-size:22px;color:#FFFFFF">Confirme a troca de e-mail</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5">Pediram para trocar o e-mail da conta de <strong>{{ .Email }}</strong> para <strong>{{ .NewEmail }}</strong>. Toque no botão abaixo para confirmar.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FBC009;color:#0A0A0A;text-decoration:none;font-weight:800;font-size:15px;padding:14px 28px;border-radius:999px">Confirmar troca</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8F8F8F">A confirmação chega nos dois e-mails, e a troca só vale depois das duas. Se não foi você, ignore esta mensagem e troque sua senha.</p>
  </div>
</div>
