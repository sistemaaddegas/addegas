<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>Addegas · sem conexão</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0B; color: #F5F5F2; font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 26px; margin: 20px 0 8px; font-weight: 800; }
    p { color: #A1A1A6; max-width: 34ch; margin: 0 auto 24px; line-height: 1.45; }
    button { height: 48px; padding: 0 22px; border: 0; border-radius: 3px 10px 2px 9px; background: #FBC009; color: #0A0A0B;
      font-size: 16px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>O Addegas precisa de internet para carregar. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
  </main>
</body>
</html>
