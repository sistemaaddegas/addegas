name: Banco e funções
# E02 · Migrations e Edge Functions sobem pelo CI, nunca pelo painel.
# Projeto único `addegas` (D64b): o mesmo banco dos testes vira a produção, então nada sobe sozinho num push.
# Sobe com uma tag v* (ou pelo botão "Run workflow") e sempre com aprovação manual no environment "production"
# do GitHub (Settings → Environments → production → Required reviewers).
# Segredos do environment "production": SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD_PRD, SUPABASE_PROJECT_REF_PRD.
# Só funciona quando esta pasta virar a raiz do repositório (README).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Duas publicações nunca rodam juntas no mesmo banco.
concurrency:
  group: banco-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PRD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with: { version: 2.122.0 }
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: supabase db advisors --linked --type security --level warn --fail-on error
      - run: supabase functions deploy --use-api
