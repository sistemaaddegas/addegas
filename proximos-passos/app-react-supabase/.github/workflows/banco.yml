name: Banco e funções
# E02 · Migrations e Edge Functions sobem pelo CI, nunca pelo painel.
#   push na main  → addegas-dev  (homologação)
#   tag v*        → addegas-prd  (com aprovação manual no environment "production" do GitHub)
# Segredos do repositório: SUPABASE_ACCESS_TOKEN (escopo dos projetos), SUPABASE_DB_PASSWORD_DEV/PRD,
# SUPABASE_PROJECT_REF_DEV/PRD. Só funciona quando esta pasta virar a raiz do repositório (README).
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
      - run: supabase db push
      - run: supabase db advisors --level warn --fail-on error || supabase db lint --level warning --fail-on error
      - run: supabase functions deploy

  prd:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PRD }}
      - run: supabase db push
      - run: supabase functions deploy
